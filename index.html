<!DOCTYPE html>
<html>
<head>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
#endingOverlay{
  position:fixed;
  inset:0;
  z-index:99999;
  pointer-events:none;
  opacity:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  transition:opacity .5s ease,background .8s ease;
}

#endingOverlay.active{
  opacity:1;
  background:radial-gradient(
    circle at center,
    #fff 0%,
    #fff 24%,
    #eeeeee 34%,
    #999 48%,
    #333 66%,
    #000 88%
  );
}

#endingOverlay.fullBlack{
  background:#000;
}

.endingSilhouette{
  position:absolute;
  width:min(58vw,620px);
  height:min(58vh,620px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  filter:blur(2.5px);
  transition:opacity .06s linear;
}

.endingSilhouette svg{
  width:100%;
  height:100%;
}

#mammothSilhouette{transform:scale(1.1);}
#humanSilhouette{transform:scale(.82);}

#endingText{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:90%;
  text-align:center;
  color:#ff1a1a;
  font-family:Arial Black,Arial,sans-serif;
  font-size:clamp(20px,2.5vw,38px);
  font-weight:900;
  letter-spacing:4px;
  opacity:0;
  text-shadow:
    0 0 6px rgba(255,0,0,.9),
    0 0 14px rgba(180,0,0,.7);
  transition:opacity 2s ease;
}

#endingText.show{opacity:1;}

#endingText::before,
#endingText::after{
  content:"";
  position:absolute;
  top:100%;
  width:5px;
  height:0;
  background:#d40000;
  border-radius:0 0 5px 5px;
  opacity:0;
}

#endingText::before{left:28%;}
#endingText::after{left:68%;}

#endingText.show::before{
  opacity:.9;
  animation:drip1 2.2s ease-in forwards;
}

#endingText.show::after{
  opacity:.8;
  animation:drip2 2.8s ease-in forwards;
}

@keyframes drip1{
  0%{height:0}
  45%{height:10px}
  75%{height:24px}
  100%{height:34px}
}

@keyframes drip2{
  0%{height:0}
  40%{height:7px}
  70%{height:18px}
  100%{height:28px}
}
</style>

<script>
AFRAME.registerComponent('wall-collision', {
  init() {
    this.lastX = this.el.object3D.position.x;
  },

  tick() {
    const p = this.el.object3D.position;

    // 两堵墙的 Z 范围
    const inWall1 = p.z >= -2 && p.z <= 12;
    const inWall2 = p.z >= -11.5 && p.z <= -6.5;

    // 墙在 x = -1.9
    if (inWall1 || inWall2) {

      // 从右边穿向左边
      if (this.lastX > -1.9 && p.x <= -1.9) {
        p.x = -1.82;
      }

      // 从左边穿向右边
      if (this.lastX < -1.9 && p.x >= -1.9) {
        p.x = -1.98;
      }
    }

    this.lastX = p.x;
  }
});
</script>

<script>
AFRAME.registerComponent('end-trigger',{
  init(){this.triggered=false;},

  tick(){
    if(this.triggered)return;

    const player=document.querySelector('#player');
    const message=document.querySelector('#openMessage');
    if(!player||!message)return;

    const p=new THREE.Vector3();
    player.object3D.getWorldPosition(p);

    if(p.distanceTo(new THREE.Vector3(0,-0.3,10.8))<0.8){
      this.triggered=true;

      player.setAttribute('wasd-controls','enabled',false);

      message.setAttribute('visible',true);
      message.setAttribute('text','opacity',0);

      message.setAttribute('animation',{
        property:'text.opacity',
        from:0,
        to:1,
        dur:2000
      });

      setTimeout(()=>{
        player.setAttribute('wasd-controls','enabled',true);

        setTimeout(()=>{
          message.setAttribute('animation__fadeout',{
            property:'text.opacity',
            from:1,
            to:0,
            dur:1000
          });

          setTimeout(()=>{
            message.setAttribute('visible',false);

            const door=document.querySelector('#doorPivot');

            if(door){
              door.setAttribute(
                'door-open',
                'enabled',
                true
              );
            }

          },1000);

        },1000);

      },2000);
    }
  }
});
</script>


<script>
AFRAME.registerComponent('door-open',{
  schema:{
    enabled:{default:false}
  },

  init(){
    this.opened=false;
  },

  tick(){
    if(!this.data.enabled||this.opened)return;

    const player=document.querySelector('#player');
    if(!player)return;

    const p=new THREE.Vector3();
    player.object3D.getWorldPosition(p);

    const door=new THREE.Vector3(
      -0.4,
      -0.3,
      10.16
    );

    if(p.distanceTo(door)<1.2){
      this.opened=true;

      this.el.setAttribute('animation',{
        property:'rotation',
        to:'0 -90 0',
        dur:1200,
        easing:'easeInOutQuad'
      });
    }
  }
});
</script>


<script>
AFRAME.registerComponent('mammoth-sound',{
  init(){
    this.ctx=null;
    this.master=null;
    this.filter=null;
    this.stereo=null;
    this.started=false;
    this.delay=2000;
    this.endingStopped=false;

    const unlock=()=>{
      this.setup();

      if(this.ctx.state==='suspended'){
        this.ctx.resume();
      }
    };

    window.addEventListener(
      'keydown',
      unlock,
      {once:true}
    );

    window.addEventListener(
      'pointerdown',
      unlock,
      {once:true}
    );
  },

  setup(){
    if(this.ctx)return;

    const AC=
      window.AudioContext||
      window.webkitAudioContext;

    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.filter=this.ctx.createBiquadFilter();
    this.stereo=this.ctx.createStereoPanner();

    this.filter.type='lowpass';

    this.filter.connect(this.stereo);
    this.stereo.connect(this.master);
    this.master.connect(this.ctx.destination);
  },

  thump(){
    if(this.endingStopped)return;

    this.setup();

    if(this.ctx.state==='suspended'){
      this.ctx.resume();
    }

    const ctx=this.ctx;
    const now=ctx.currentTime;

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type='sine';

    osc.frequency.setValueAtTime(85,now);

    osc.frequency.exponentialRampToValueAtTime(
      42,
      now+.28
    );

    gain.gain.setValueAtTime(.001,now);

    gain.gain.exponentialRampToValueAtTime(
      .8,
      now+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+.35
    );

    osc.connect(gain);
    gain.connect(this.filter);

    osc.start(now);
    osc.stop(now+.4);

    const buffer=ctx.createBuffer(
      1,
      ctx.sampleRate*.08,
      ctx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
      data[i]=
        (Math.random()*2-1)*
        (1-i/data.length);
    }

    const noise=ctx.createBufferSource();
    const noiseGain=ctx.createGain();

    noise.buffer=buffer;

    noiseGain.gain.setValueAtTime(
      .20,
      now
    );

    noiseGain.gain.exponentialRampToValueAtTime(
      .001,
      now+.08
    );

    noise.connect(noiseGain);
    noiseGain.connect(this.filter);

    noise.start(now);
  },

  burst(){
    this.thump();
    setTimeout(()=>this.thump(),320);
    setTimeout(()=>this.thump(),650);
  },

  startLoop(){
    if(this.started)return;

    this.started=true;

    const loop=()=>{
      if(this.endingStopped)return;

      this.burst();

      const wait=this.delay;

      this.delay=
        this.delay===2000
        ?3000
        :2000;

      this.timer=setTimeout(loop,wait);
    };

    this.timer=setTimeout(loop,4000);
  },

  stopLoop(){
    this.endingStopped=true;

    if(this.timer){
      clearTimeout(this.timer);
      this.timer=null;
    }

    if(this.master&&this.ctx){
      const now=this.ctx.currentTime;

      this.master.gain.cancelScheduledValues(now);

      this.master.gain.setValueAtTime(
        this.master.gain.value,
        now
      );

      this.master.gain.linearRampToValueAtTime(
        0,
        now+.8
      );
    }
  },

  tick(){
    if(!this.ctx||this.endingStopped)return;

    const player=
      document.querySelector('#player');

    if(!player)return;

    const roomPos=new THREE.Vector3();

    this.el.object3D.getWorldPosition(
      roomPos
    );

    const playerPos=new THREE.Vector3();

    player.object3D.getWorldPosition(
      playerPos
    );

    const distance=
      playerPos.distanceTo(roomPos);

    let volume;

    if(distance>18)volume=.12;
    else if(distance>12)volume=.22;
    else if(distance>8)volume=.38;
    else if(distance>5)volume=.58;
    else if(distance>3)volume=.78;
    else volume=1;

    this.master.gain.value=volume;

    let cutoff;

    if(distance>16)cutoff=350;
    else if(distance>10)cutoff=650;
    else if(distance>6)cutoff=1200;
    else if(distance>3)cutoff=2400;
    else cutoff=5000;

    this.filter.frequency.value=cutoff;

    const direction=
      roomPos.clone().sub(playerPos);

    const quaternion=
      player.object3D.getWorldQuaternion(
        new THREE.Quaternion()
      );

    direction.applyQuaternion(
      quaternion.clone().invert()
    );

    const horizontal=direction.x;
    const forward=-direction.z;

    let pan=
      horizontal/
      (
        Math.abs(horizontal)+
        Math.abs(forward)*.35+
        .001
      );

    pan*=1.8;

    pan=Math.max(
      -1,
      Math.min(1,pan)
    );

    this.stereo.pan.value=pan;
  }
});
</script>


<script>
AFRAME.registerComponent('player-run',{
  init(){
    this.keys={};
    this.bobTime=0;
    this.ctx=null;

    this.baseY=
      this.el.object3D.position.y;

    window.addEventListener('keydown',e=>{
      this.keys[e.key.toLowerCase()]=true;

      if(!this.ctx){
        const AC=
          window.AudioContext||
          window.webkitAudioContext;

        this.ctx=new AC();
      }
    });

    window.addEventListener('keyup',e=>{
      this.keys[e.key.toLowerCase()]=false;
    });

    setInterval(()=>{
      if(this.running){
        this.breath();
      }
    },1400);
  },

  breath(){
    if(!this.ctx)return;

    const ctx=this.ctx;
    const now=ctx.currentTime;

    const buffer=ctx.createBuffer(
      1,
      ctx.sampleRate*.45,
      ctx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
      data[i]=
        (Math.random()*2-1)*
        Math.sin(
          Math.PI*i/data.length
        );
    }

    const source=
      ctx.createBufferSource();

    const filter=
      ctx.createBiquadFilter();

    const gain=
      ctx.createGain();

    source.buffer=buffer;

    filter.type='bandpass';
    filter.frequency.value=650;
    filter.Q.value=.7;

    gain.gain.value=.012;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    source.start(now);
  },

  tick(time,delta){
    const wasd=
      this.el.components['wasd-controls'];

    if(
      wasd&&
      wasd.data.enabled===false
    ){
      this.running=false;
      return;
    }

    this.running=
      this.keys.w||
      this.keys.a||
      this.keys.s||
      this.keys.d;

    if(!this.running){
      this.bobTime=0;

      this.el.object3D.position.y=
        this.baseY;

      return;
    }

    this.bobTime+=delta*.0023;

    const bob=
      Math.sin(
        this.bobTime*8
      )*.05;

    this.el.object3D.position.y=
      this.baseY+bob;
  }
});
</script>


<script>
AFRAME.registerComponent('intro-trigger',{
  init(){
    this.triggered=false;
    this.waitingForT=false;

    this.keyHandler=event=>{
      if(
        !this.waitingForT||
        event.key.toLowerCase()!=='t'
      )return;

      this.waitingForT=false;

      const player=
        document.querySelector('#player');

      const lines=[
        document.querySelector('#introLine1'),
        document.querySelector('#introLine2'),
        document.querySelector('#introLine3'),
        document.querySelector('#introLine4')
      ];

      lines.forEach((line,i)=>{
        line.setAttribute(
          'animation__out'+i,
          {
            property:'text.opacity',
            from:1,
            to:0,
            dur:500
          }
        );
      });

      setTimeout(()=>{
        lines.forEach(line=>
          line.setAttribute(
            'visible',
            false
          )
        );

        player.setAttribute(
          'wasd-controls',
          'enabled',
          true
        );

      },500);
    };

    window.addEventListener(
      'keydown',
      this.keyHandler
    );
  },

  tick(){
    if(this.triggered)return;

    const player=
      document.querySelector('#player');

    const line1=
      document.querySelector('#introLine1');

    const line2=
      document.querySelector('#introLine2');

    const line3=
      document.querySelector('#introLine3');

    const line4=
      document.querySelector('#introLine4');

    const ambient=
      document.querySelector('#ambientLight');

    const directional=
      document.querySelector('#directionalLight');

    const room2=
      document.querySelector('#room2');

    if(
      !player||
      !line1||
      !line2||
      !line3||
      !line4||
      !ambient||
      !directional||
      !room2
    )return;

    const pos=new THREE.Vector3();

    player.object3D.getWorldPosition(pos);

    const dx=pos.x-8.4;
    const dz=pos.z-10;

    const distance=
      Math.sqrt(dx*dx+dz*dz);

    if(distance<.8){
      this.triggered=true;

      player.setAttribute(
        'wasd-controls',
        'enabled',
        false
      );

      const sound=
        room2.components['mammoth-sound'];

      sound.startLoop();

      const startX=
        player.object3D.position.x;

      const startY=
        player.object3D.position.y;

      sound.thump();

      player.object3D.position.x=
        startX+.12;

      ambient.setAttribute(
        'light',
        'intensity',
        .1
      );

      directional.setAttribute(
        'light',
        'intensity',
        .05
      );

      setTimeout(()=>{
        sound.thump();

        player.object3D.position.x=
          startX;

        player.object3D.position.y=
          startY+.10;

        ambient.setAttribute(
          'light',
          'intensity',
          3
        );

        directional.setAttribute(
          'light',
          'intensity',
          1
        );

      },180);

      setTimeout(()=>{
        sound.thump();

        player.object3D.position.y=
          startY;

        player.object3D.position.x=
          startX-.15;

        ambient.setAttribute(
          'light',
          'intensity',
          .1
        );

        directional.setAttribute(
          'light',
          'intensity',
          .05
        );

      },360);

      setTimeout(()=>{
        sound.thump();

        player.object3D.position.x=
          startX;

        player.object3D.position.y=
          startY-.10;

        ambient.setAttribute(
          'light',
          'intensity',
          3
        );

        directional.setAttribute(
          'light',
          'intensity',
          1
        );

      },540);

      setTimeout(()=>{
        player.object3D.position.x=
          startX;

        player.object3D.position.y=
          startY;

        ambient.setAttribute(
          'light',
          'intensity',
          3
        );

        directional.setAttribute(
          'light',
          'intensity',
          1
        );

        line1.setAttribute(
          'visible',
          true
        );

        line1.setAttribute(
          'animation__intro1',
          {
            property:'text.opacity',
            from:0,
            to:1,
            dur:700
          }
        );

        setTimeout(()=>{
          line2.setAttribute(
            'visible',
            true
          );

          line2.setAttribute(
            'animation__intro2',
            {
              property:'text.opacity',
              from:0,
              to:1,
              dur:700
            }
          );
        },1000);

        setTimeout(()=>{
          line3.setAttribute(
            'visible',
            true
          );

          line3.setAttribute(
            'animation__intro3',
            {
              property:'text.opacity',
              from:0,
              to:1,
              dur:700
            }
          );
        },2000);

        setTimeout(()=>{
          line4.setAttribute(
            'visible',
            true
          );

          line4.setAttribute(
            'animation__intro4',
            {
              property:'text.opacity',
              from:0,
              to:1,
              dur:700
            }
          );

          this.waitingForT=true;

        },3000);

      },900);
    }
  }
});
</script>


<!-- 结尾音乐 -->
<script>
function playEndingMusic(){

  const AC=
    window.AudioContext||
    window.webkitAudioContext;

  const ctx=new AC();
  const master=ctx.createGain();

  master.gain.setValueAtTime(
    0,
    ctx.currentTime
  );

  master.gain.linearRampToValueAtTime(
    .07,
    ctx.currentTime+3
  );

  master.connect(ctx.destination);

  [
    [110,.35],
    [165,.18],
    [330,.05]
  ].forEach(([freq,vol])=>{

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type='sine';
    osc.frequency.value=freq;
    gain.gain.value=vol;

    osc.connect(gain);
    gain.connect(master);

    osc.start();
  });

  const lfo=ctx.createOscillator();
  const lfoGain=ctx.createGain();

  lfo.frequency.value=.12;
  lfoGain.gain.value=.015;

  lfo.connect(lfoGain);
  lfoGain.connect(master.gain);

  lfo.start();
}
</script>


<!-- 最终结尾 -->
<script>
AFRAME.registerComponent('final-ending-trigger',{
  init(){
    this.triggered=false;
  },

  tick(){
    if(this.triggered)return;

    const player=
      document.querySelector('#player');

    const overlay=
      document.querySelector('#endingOverlay');

    const mammoth=
      document.querySelector('#mammothSilhouette');

    const human=
      document.querySelector('#humanSilhouette');

    const text=
      document.querySelector('#endingText');

    if(
      !player||
      !overlay||
      !mammoth||
      !human||
      !text
    )return;

    const p=new THREE.Vector3();

    player.object3D.getWorldPosition(p);

    const target=
      new THREE.Vector3(
        -5.1,
        -0.3,
        -6.5
      );

    if(p.distanceTo(target)<.8){

      this.triggered=true;

      player.setAttribute(
        'wasd-controls',
        'enabled',
        false
      );

      overlay.classList.add('active');

      const sleep=ms=>
        new Promise(resolve=>
          setTimeout(resolve,ms)
        );

      const showMammoth=async ms=>{
        mammoth.style.opacity=1;
        human.style.opacity=0;
        await sleep(ms);
      };

      const showHuman=async ms=>{
        mammoth.style.opacity=0;
        human.style.opacity=1;
        await sleep(ms);
      };

      const run=async()=>{

        await showMammoth(1000);
        await showHuman(1000);

        await showMammoth(500);
        await showHuman(500);

        await showMammoth(350);
        await showHuman(350);

        await showMammoth(220);
        await showHuman(220);

        await showMammoth(110);
        await showHuman(110);

        await showMammoth(80);
        await showHuman(80);

        mammoth.style.opacity=0;
        human.style.opacity=0;

        overlay.classList.add(
          'fullBlack'
        );

        await sleep(1800);

        const room2=
          document.querySelector('#room2');

        if(
          room2&&
          room2.components['mammoth-sound']
        ){
          room2.components[
            'mammoth-sound'
          ].stopLoop();
        }

        text.classList.add('show');

        setTimeout(()=>{
          playEndingMusic();
        },500);
      };

      run();
    }
  }
});
</script>
