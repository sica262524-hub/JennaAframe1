<!-- 最后白点 -->
<script>
AFRAME.registerComponent('end-trigger', {

  init: function () {
    this.triggered = false;
  },

  tick: function () {

    if (this.triggered) return;

    const player = document.querySelector('#player');
    const message = document.querySelector('#openMessage');

    if (!player || !message) return;

    const p = new THREE.Vector3();
    player.object3D.getWorldPosition(p);

    const target = new THREE.Vector3(0, -0.3, 10.8);

    if (p.distanceTo(target) < 0.8) {

      this.triggered = true;

      player.setAttribute('wasd-controls', 'enabled', false);

      message.setAttribute('visible', true);
      message.setAttribute('text', 'opacity', 0);

      message.setAttribute('animation', {
        property: 'text.opacity',
        from: 0,
        to: 1,
        dur: 2000
      });

      setTimeout(() => {

        player.setAttribute('wasd-controls', 'enabled', true);

        setTimeout(() => {

          message.setAttribute('animation__fadeout', {
            property: 'text.opacity',
            from: 1,
            to: 0,
            dur: 1000
          });

          setTimeout(() => {

            message.setAttribute('visible', false);

            const door = document.querySelector('#doorPivot');

            if (door) {
              door.setAttribute('door-open', 'enabled', true);
            }

          }, 1000);

        }, 1000);

      }, 2000);
    }
  }
});
</script>


<!-- 门 -->
<script>
AFRAME.registerComponent('door-open', {

  schema: {
    enabled: {default: false}
  },

  init: function () {
    this.opened = false;
  },

  tick: function () {

    if (!this.data.enabled || this.opened) return;

    const player = document.querySelector('#player');
    if (!player) return;

    const p = new THREE.Vector3();
    player.object3D.getWorldPosition(p);

    const door = new THREE.Vector3(
      -0.4,
      -0.3,
      10.16
    );

    if (p.distanceTo(door) < 1.2) {

      this.opened = true;

      this.el.setAttribute('animation', {
        property: 'rotation',
        to: '0 -90 0',
        dur: 1200,
        easing: 'easeInOutQuad'
      });
    }
  }
});
</script>


<!-- Room2 声音 -->
<script>
AFRAME.registerComponent('mammoth-sound', {

  init: function () {

    this.ctx = null;
    this.master = null;
    this.filter = null;
    this.stereo = null;

    this.started = false;
    this.delay = 2000;

    const unlock = () => {

      this.setup();

      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    };

    window.addEventListener('keydown', unlock, {once:true});
    window.addEventListener('pointerdown', unlock, {once:true});
  },


  setup: function () {

    if (this.ctx) return;

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    this.ctx = new AC();

    this.master =
      this.ctx.createGain();

    this.filter =
      this.ctx.createBiquadFilter();

    this.filter.type = 'lowpass';

    this.stereo =
      this.ctx.createStereoPanner();

    this.filter.connect(this.stereo);
    this.stereo.connect(this.master);
    this.master.connect(this.ctx.destination);
  },


  thump: function () {

    this.setup();

    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }

    const ctx = this.ctx;
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sine';

    osc.frequency.setValueAtTime(85, now);

    osc.frequency.exponentialRampToValueAtTime(
      42,
      now + 0.28
    );

    gain.gain.setValueAtTime(0.001, now);

    gain.gain.exponentialRampToValueAtTime(
      0.8,
      now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.35
    );

    osc.connect(gain);
    gain.connect(this.filter);

    osc.start(now);
    osc.stop(now + 0.4);


    const buffer = ctx.createBuffer(
      1,
      ctx.sampleRate * 0.08,
      ctx.sampleRate
    );

    const data =
      buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {

      data[i] =
        (Math.random() * 2 - 1) *
        (1 - i / data.length);
    }

    const noise =
      ctx.createBufferSource();

    const noiseGain =
      ctx.createGain();

    noise.buffer = buffer;

    noiseGain.gain.setValueAtTime(
      0.20,
      now
    );

    noiseGain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.08
    );

    noise.connect(noiseGain);
    noiseGain.connect(this.filter);

    noise.start(now);
  },


  burst: function () {

    this.thump();

    setTimeout(() => this.thump(), 320);
    setTimeout(() => this.thump(), 650);
  },


  startLoop: function () {

    if (this.started) return;

    this.started = true;

    const loop = () => {

      this.burst();

      const wait = this.delay;

      this.delay =
        this.delay === 2000
        ? 3000
        : 2000;

      this.timer =
        setTimeout(loop, wait);
    };

    this.timer =
      setTimeout(loop, 4000);
  },


  tick: function () {

    if (!this.ctx) return;

    const player =
      document.querySelector('#player');

    if (!player) return;

    const roomPos =
      new THREE.Vector3();

    this.el.object3D.getWorldPosition(
      roomPos
    );

    const playerPos =
      new THREE.Vector3();

    player.object3D.getWorldPosition(
      playerPos
    );


    const distance =
      playerPos.distanceTo(roomPos);


    let volume;

    if (distance > 18) {
      volume = 0.12;
    } else if (distance > 12) {
      volume = 0.22;
    } else if (distance > 8) {
      volume = 0.38;
    } else if (distance > 5) {
      volume = 0.58;
    } else if (distance > 3) {
      volume = 0.78;
    } else {
      volume = 1;
    }

    this.master.gain.value =
      volume;


    let cutoff;

    if (distance > 16) {
      cutoff = 350;
    } else if (distance > 10) {
      cutoff = 650;
    } else if (distance > 6) {
      cutoff = 1200;
    } else if (distance > 3) {
      cutoff = 2400;
    } else {
      cutoff = 5000;
    }

    this.filter.frequency.value =
      cutoff;


    const direction =
      roomPos.clone().sub(playerPos);

    const quaternion =
      player.object3D.getWorldQuaternion(
        new THREE.Quaternion()
      );

    direction.applyQuaternion(
      quaternion.clone().invert()
    );


    const horizontal = direction.x;
    const forward = -direction.z;

    let pan =
      horizontal /
      (
        Math.abs(horizontal) +
        Math.abs(forward) * 0.35 +
        0.001
      );

    pan *= 1.8;

    pan = Math.max(
      -1,
      Math.min(1, pan)
    );

    this.stereo.pan.value =
      pan;
  }

});
</script>


<!-- 玩家小跑：只有喘息 + 上下起伏 -->
<script>
AFRAME.registerComponent('player-run', {

  init: function () {

    this.keys = {};
    this.bobTime = 0;
    this.ctx = null;

    this.baseY =
      this.el.object3D.position.y;

    window.addEventListener('keydown', e => {

      this.keys[e.key.toLowerCase()] = true;

      if (!this.ctx) {

        const AC =
          window.AudioContext ||
          window.webkitAudioContext;

        this.ctx = new AC();
      }
    });

    window.addEventListener('keyup', e => {
      this.keys[e.key.toLowerCase()] = false;
    });


    setInterval(() => {

      if (this.running) {
        this.breath();
      }

    }, 1400);
  },


  breath: function () {

    if (!this.ctx) return;

    const ctx = this.ctx;
    const now = ctx.currentTime;

    const buffer = ctx.createBuffer(
      1,
      ctx.sampleRate * 0.45,
      ctx.sampleRate
    );

    const data =
      buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {

      data[i] =
        (Math.random() * 2 - 1) *
        Math.sin(
          Math.PI * i / data.length
        );
    }

    const source =
      ctx.createBufferSource();

    const filter =
      ctx.createBiquadFilter();

    const gain =
      ctx.createGain();

    source.buffer = buffer;

    filter.type = 'bandpass';
    filter.frequency.value = 650;
    filter.Q.value = 0.7;

    // 很轻的喘息
    gain.gain.value = 0.012;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    source.start(now);
  },


  tick: function (time, delta) {

    const wasd =
      this.el.components['wasd-controls'];

    if (
      wasd &&
      wasd.data.enabled === false
    ) {

      this.running = false;
      return;
    }


    this.running =
      this.keys['w'] ||
      this.keys['a'] ||
      this.keys['s'] ||
      this.keys['d'];


    // 不跑时恢复正常
    if (!this.running) {

      this.bobTime = 0;

      this.el.object3D.position.y =
        this.baseY;

      return;
    }


    // 跑动时明显上下起伏
    this.bobTime += delta * 0.0023;

    const bob =
      Math.sin(
        this.bobTime * 8
      ) * 0.05;

    this.el.object3D.position.y =
      this.baseY + bob;
  }

});
</script>

<script>
AFRAME.registerComponent('intro-trigger', {

  init: function () {

    this.triggered = false;
    this.waitingForT = false;

    this.keyHandler = (event) => {

      if (
        !this.waitingForT ||
        event.key.toLowerCase() !== 't'
      ) return;

      this.waitingForT = false;

      const player =
        document.querySelector('#player');

      const lines = [
        document.querySelector('#introLine1'),
        document.querySelector('#introLine2'),
        document.querySelector('#introLine3'),
        document.querySelector('#introLine4')
      ];

      lines.forEach((line, i) => {

        line.setAttribute(
          'animation__out' + i,
          {
            property: 'text.opacity',
            from: 1,
            to: 0,
            dur: 500
          }
        );
      });

      setTimeout(() => {

        lines.forEach(line =>
          line.setAttribute(
            'visible',
            false
          )
        );

        player.setAttribute(
          'wasd-controls',
          'enabled',
          true
        );

      }, 500);
    };

    window.addEventListener(
      'keydown',
      this.keyHandler
    );
  },


  tick: function () {

    if (this.triggered) return;

    const player =
      document.querySelector('#player');

    const line1 =
      document.querySelector('#introLine1');

    const line2 =
      document.querySelector('#introLine2');

    const line3 =
      document.querySelector('#introLine3');

    const line4 =
      document.querySelector('#introLine4');

    const ambient =
      document.querySelector('#ambientLight');

    const directional =
      document.querySelector('#directionalLight');

    const room2 =
      document.querySelector('#room2');

    if (
      !player ||
      !line1 ||
      !line2 ||
      !line3 ||
      !line4 ||
      !ambient ||
      !directional ||
      !room2
    ) return;


    const pos =
      new THREE.Vector3();

    player.object3D.getWorldPosition(pos);

    const dx = pos.x - 8.4;
    const dz = pos.z - 10;

    const distance =
      Math.sqrt(dx * dx + dz * dz);


    if (distance < 0.8) {

      this.triggered = true;

      player.setAttribute(
        'wasd-controls',
        'enabled',
        false
      );

      const sound =
        room2.components['mammoth-sound'];

      sound.startLoop();

      const startX =
        player.object3D.position.x;

      const startY =
        player.object3D.position.y;


      sound.thump();

      player.object3D.position.x =
        startX + 0.12;

      ambient.setAttribute(
        'light',
        'intensity',
        0.1
      );

      directional.setAttribute(
        'light',
        'intensity',
        0.05
      );


      setTimeout(() => {

        sound.thump();

        player.object3D.position.x =
          startX;

        player.object3D.position.y =
          startY + 0.10;

        ambient.setAttribute(
          'light',
          'intensity',
          3
        );

        directional.setAttribute(
          'light',
          'intensity',
          1
        );

      }, 180);


      setTimeout(() => {

        sound.thump();

        player.object3D.position.y =
          startY;

        player.object3D.position.x =
          startX - 0.15;

        ambient.setAttribute(
          'light',
          'intensity',
          0.1
        );

        directional.setAttribute(
          'light',
          'intensity',
          0.05
        );

      }, 360);


      setTimeout(() => {

        sound.thump();

        player.object3D.position.x =
          startX;

        player.object3D.position.y =
          startY - 0.10;

        ambient.setAttribute(
          'light',
          'intensity',
          3
        );

        directional.setAttribute(
          'light',
          'intensity',
          1
        );

      }, 540);


      setTimeout(() => {

        player.object3D.position.x =
          startX;

        player.object3D.position.y =
          startY;

        ambient.setAttribute(
          'light',
          'intensity',
          3
        );

        directional.setAttribute(
          'light',
          'intensity',
          1
        );


        line1.setAttribute(
          'visible',
          true
        );

        line1.setAttribute(
          'animation__intro1',
          {
            property: 'text.opacity',
            from: 0,
            to: 1,
            dur: 700
          }
        );


        setTimeout(() => {

          line2.setAttribute(
            'visible',
            true
          );

          line2.setAttribute(
            'animation__intro2',
            {
              property: 'text.opacity',
              from: 0,
              to: 1,
              dur: 700
            }
          );

        }, 1000);


        setTimeout(() => {

          line3.setAttribute(
            'visible',
            true
          );

          line3.setAttribute(
            'animation__intro3',
            {
              property: 'text.opacity',
              from: 0,
              to: 1,
              dur: 700
            }
          );

        }, 2000);


        setTimeout(() => {

          line4.setAttribute(
            'visible',
            true
          );

          line4.setAttribute(
            'animation__intro4',
            {
              property: 'text.opacity',
              from: 0,
              to: 1,
              dur: 700
            }
          );

          this.waitingForT = true;

        }, 3000);

      }, 900);
    }
  }
});
</script>
